# OpenSandbox Server Configuration for Seamus (Docker Runtime)

[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 86400

[proxy]
# Target host-mapped sandbox ports via host.docker.internal when running inside a Compose container
resolve_internal = false

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.1.0"

[storage]
allowed_host_paths = ["/tmp", "/home", "/var", "/app", "/opt", "/srv", "/Users"]
volume_default_size = "1Gi"

[store]
type = "sqlite"
path = "/data/opensandbox.db"

[docker]
network_mode = "bridge"
host_ip = "host.docker.internal"
port_range_min = 40000
port_range_max = 60000
drop_capabilities = [
    "AUDIT_WRITE",
    "MKNOD",
    "NET_ADMIN",
    "NET_RAW",
    "SYS_ADMIN",
    "SYS_MODULE",
    "SYS_PTRACE",
    "SYS_TIME",
    "SYS_TTY_CONFIG",
]
no_new_privileges = true
apparmor_profile = ""
pids_limit = 4096
seccomp_profile = ""

[ingress]
mode = "direct"

[egress]
image = "opensandbox/egress:v1.1.7"
mode = "dns"
readiness_timeout_seconds = 30.0

[renew_intent]
enabled = false
min_interval_seconds = 60

