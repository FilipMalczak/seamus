services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gitea}
      POSTGRES_USER: ${POSTGRES_USER:-gitea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitea}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitea} -d ${POSTGRES_DB:-gitea}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  gitea:
    image: gitea/gitea:latest
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=${POSTGRES_DB:-gitea}
      - GITEA__database__USER=${POSTGRES_USER:-gitea}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD:-gitea}
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY:-seamus-gitea-secret-key-12345}
      - GITEA__server__ROOT_URL=http://localhost:3001/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__DISABLE_SSH=true
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
    ports:
      - "3001:3000"
    volumes:
      - gitea-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/v1/version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  gitea-init:
    image: gitea/gitea:latest
    user: "1000:1000"
    restart: "no"
    depends_on:
      gitea:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        gitea admin user create --work-path /data/gitea --config /data/gitea/conf/app.ini --username "$${GITEA_ADMIN_USER:-seamus}" --password "$${GITEA_ADMIN_PASSWORD:-seamus-password-123}" --email "$${GITEA_ADMIN_EMAIL:-seamus@seamus.local}" --admin --must-change-password=false || true
    volumes:
      - gitea-data:/data

  opensandbox:
    build:
      context: ./opensandbox
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - opensandbox-data:/data
      - opensandbox-auth:/var/run/seamus-opensandbox

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GITEA_URL=${GITEA_URL:-http://gitea:3000}
      - GITEA_EXTERNAL_URL=${GITEA_EXTERNAL_URL:-http://localhost:3001}
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-seamus}
      - GITEA_ADMIN_PASSWORD=${GITEA_ADMIN_PASSWORD:-seamus-password-123}
      - SEAMUS_WORKSPACE_DIR=/app/workspaces
      - OPENSANDBOX_DOMAIN=${OPENSANDBOX_DOMAIN:-opensandbox:8080}
      - OPENSANDBOX_PROTOCOL=${OPENSANDBOX_PROTOCOL:-http}
      - OPENSANDBOX_IMAGE=${OPENSANDBOX_IMAGE:-python:3.12-slim}
      - OPENSANDBOX_WORKDIR=${OPENSANDBOX_WORKDIR:-/workspace}
      - OPENSANDBOX_WORKSPACE_VOLUME=seamus-workspaces
      - SEAMUS_OPENSANDBOX_KEY_FILE=/var/run/seamus-opensandbox/api_key
      - SEAMUS_HOST_HOME=${HOME:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - backend-workspaces:/app/workspaces
      - opensandbox-auth:/var/run/seamus-opensandbox:ro
      - ${HOME:-/root}:${HOME:-/root}:ro
    ports:
      - "8000:8000"
    depends_on:
      gitea:
        condition: service_healthy
      gitea-init:
        condition: service_completed_successfully
      opensandbox:
        condition: service_healthy

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  gitea-data:
  backend-workspaces:
    name: seamus-workspaces
  opensandbox-data:
  opensandbox-auth:
