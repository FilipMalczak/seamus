name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting (ruff format)
        run: uv run ruff format --check

      - name: Run linter (ruff check)
        run: uv run ruff check

      - name: Run type checker (mypy)
        run: uv run mypy

  frontend:
    name: Frontend Build, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

  test-docker:
    name: Pytest (Ubuntu, Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit and integration tests (docker persistence enabled)
        run: uv run pytest

  test-in-memory:
    name: Pytest (Ubuntu, In-Memory)
    runs-on: ubuntu-latest
    env:
      SEAMUS_TEST_IN_MEMORY: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit and integration tests (in-memory mode)
        run: uv run pytest

  test-e2e:
    name: Pytest (End-to-End, Steerable LLM)
    runs-on: ubuntu-latest
    env:
      SEAMUS_TEST_IN_MEMORY: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      # The end-to-end suite drives the real harness with the scripted
      # `steerable` inference provider and an in-process sandbox stub, so it
      # needs neither an API key nor a live container.
      - name: Run end-to-end tests
        run: uv run pytest tests/e2e --e2e -v

